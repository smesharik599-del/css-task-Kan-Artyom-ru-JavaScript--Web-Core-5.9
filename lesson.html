<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/code.css">
  <title>Document</title>
</head>
<body>
  <section>
    <div class="first-block">
      <div class="image-container">
        <img src="/bg.jpg" alt="main_img" class="main-image">
      </div>
    </div>
    <div class="second-block">
      <div class="second-part">
        <H1 class="opening-text">
          Get iinto it today
        </H1>
        <p class="opening-text_subhead">
          There is no charge or obligation upon registration
        </p>
        <div class="link-sm">
          <a href="#" class="link-disc">
            <div class="facebook-logo">
              <img src="/facebook.svg" alt="facebook" class="social-logo_img">
              <div class="link-sm_text">
                <p class="social-logo_text">Register with facebook</p>
              </div>
            </div>
          </a>
          <a href="#" class="link-disc">
            <div class="linkedin-logo">
              <img src="/linkedin.svg" alt="facebook" class="social-logo_img">
              <div class="link-sm_text">
                <p class="social-logo_text">Register with Linkedin</p>
              </div>
            </div>
          </a>
        </div>
        <div class="or">
          <p class="or-text"> or </p> 
        </div>   
        <div class="input-container">
          <div class="input-block_em">
            <label for="email" class="labelem">Email</label>
            <input type="email" id="email">
            <div class="hidden">
            </div>
          </div>
          <div class="input-block_ph">
            <label for="Phone" class="labelph">Phone</label>
            <input type="text" id="Phone">
            <div class="hidden">
            </div>
          </div>
        </div>   
      </div>
    </div>
  </section>

</body>
</html>
